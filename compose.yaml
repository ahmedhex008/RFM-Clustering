services:
  api:
    image: rfm-clustering-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  streamlit:
    image: rfm-clustering-streamlit:latest
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      RFM_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mlflow_data:
