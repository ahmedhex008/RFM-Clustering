[project]
name = "rfm-clustering"
version = "0.1.0"
description = "Reproducible RFM customer segmentation project with DVC, Hydra, MLflow, uv, Git and DagsHub"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dvc[s3]>=3.0",
    "hydra-core>=1.3",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "mlflow>=3.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
