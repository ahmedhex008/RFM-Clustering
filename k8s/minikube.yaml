apiVersion: v1
kind: Namespace
metadata:
  name: rfm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rfm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: rfm-clustering-api:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: processed-data
              mountPath: /app/data/processed
              readOnly: true
      volumes:
        - name: models
          secret:
            secretName: rfm-models
        - name: processed-data
          secret:
            secretName: rfm-processed-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rfm
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: rfm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: rfm-clustering-streamlit:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: RFM_API_URL
              value: http://api:8000
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: rfm
spec:
  selector:
    app: streamlit
  ports:
    - name: http
      port: 8501
      targetPort: http
